<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Publicar objeto - Lost & Found</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <a class="navbar-brand fw-bold" href="index.html">
                🔎 Lost & Found
            </a>


            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>


            <div
                class="collapse navbar-collapse"
                id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="lost.html">

                            Objetos perdidos

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link"
                            href="found.html">

                            Objetos encontrados

                        </a>

                    </li>


                    <li class="nav-item">

                        <a
                            class="nav-link active"
                            href="publish.html">

                            Publicar

                        </a>

                    </li>

                </ul>

            </div>

        </div>

    </nav>



    <!-- TÍTULO -->

    <section class="page-title">

        <div class="container text-center">

            <h1>➕ Publicar objeto</h1>

            <p class="lead mb-0">
                Registrá un objeto perdido o encontrado
            </p>

        </div>

    </section>



    <!-- FORMULARIO -->

    <main class="container my-5">

        <div class="row justify-content-center">

            <div class="col-lg-7">

                <div class="card shadow-sm border-0">

                    <div class="card-body p-4 p-md-5">

                        <form id="publishForm">


                            <!-- TIPO -->

                            <div class="mb-4">

                                <label
                                    for="type"
                                    class="form-label fw-bold">

                                    Tipo de publicación

                                </label>


                                <select
                                    id="type"
                                    class="form-select"
                                    required>

                                    <option value="">
                                        Seleccionar...
                                    </option>

                                    <option value="lost">
                                        🔴 Objeto perdido
                                    </option>

                                    <option value="found">
                                        🟢 Objeto encontrado
                                    </option>

                                </select>

                            </div>



                            <!-- NOMBRE -->

                            <div class="mb-4">

                                <label
                                    for="name"
                                    class="form-label fw-bold">

                                    Nombre del objeto

                                </label>


                                <input
                                    type="text"
                                    id="name"
                                    class="form-control"
                                    placeholder="Ej: Mochila negra"
                                    required>

                            </div>



                            <!-- DESCRIPCIÓN -->

                            <div class="mb-4">

                                <label
                                    for="description"
                                    class="form-label fw-bold">

                                    Descripción

                                </label>


                                <textarea
                                    id="description"
                                    class="form-control"
                                    rows="4"
                                    placeholder="Describí el objeto con la mayor cantidad de detalles posible..."
                                    required>
                                </textarea>

                            </div>



                            <!-- LUGAR -->

                            <div class="mb-4">

                                <label
                                    for="location"
                                    class="form-label fw-bold">

                                    Lugar

                                </label>


                                <input
                                    type="text"
                                    id="location"
                                    class="form-control"
                                    placeholder="Ej: Patio del colegio"
                                    required>

                            </div>



                            <!-- FECHA -->

                            <div class="mb-4">

                                <label
                                    for="date"
                                    class="form-label fw-bold">

                                    Fecha

                                </label>


                                <input
                                    type="date"
                                    id="date"
                                    class="form-control"
                                    required>

                            </div>



                            <!-- IMAGEN -->

                            <div class="mb-4">

                                <label
                                    for="image"
                                    class="form-label fw-bold">

                                    Imagen del objeto

                                </label>


                                <input
                                    type="file"
                                    id="image"
                                    class="form-control"
                                    accept="image/*">

                                <div class="form-text">

                                    La imagen ayuda a identificar el objeto.

                                </div>

                            </div>



                            <!-- MENSAJE -->

                            <div
                                id="message"
                                class="mb-3">
                            </div>



                            <!-- BOTÓN -->

                            <button
                                type="submit"
                                id="submitButton"
                                class="btn btn-primary w-100">

                                Publicar objeto

                            </button>


                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>



    <!-- FOOTER -->

    <footer class="bg-dark text-white text-center py-4">

        <p class="mb-0">
            Lost & Found © 2026
        </p>

        <small>
            Sistema escolar de objetos perdidos y encontrados
        </small>

    </footer>



    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="app.js"></script>


    <script>

        const form = document.getElementById("publishForm");

        const message = document.getElementById("message");

        const submitButton = document.getElementById("submitButton");


        form.addEventListener("submit", async function(event) {

            event.preventDefault();


            submitButton.disabled = true;

            submitButton.textContent = "Publicando...";


            message.innerHTML = "";



            try {


                const type =
                    document.getElementById("type").value;

                const name =
                    document.getElementById("name").value.trim();

                const description =
                    document.getElementById("description").value.trim();

                const location =
                    document.getElementById("location").value.trim();

                const date =
                    document.getElementById("date").value;

                const imageInput =
                    document.getElementById("image");


                let imageUrl = null;



                // SUBIR IMAGEN

                if (imageInput.files.length > 0) {

                    const file =
                        imageInput.files[0];


                    const fileExtension =
                        file.name.split(".").pop();


                    const fileName =
    `${Date.now()}-${Math.floor(Math.random() * 100000)}.${fileExtension}`;


                    const filePath =
                        `items/${fileName}`;



                    const { error: uploadError } =
                        await supabaseClient
                            .storage
                            .from("item-images")
                            .upload(filePath, file);


                    if (uploadError) {

                        console.error(uploadError);

                        throw new Error(
                            "No se pudo subir la imagen."
                        );

                    }



                    const { data: publicUrlData } =
                        supabaseClient
                            .storage
                            .from("item-images")
                            .getPublicUrl(filePath);


                    imageUrl =
                        publicUrlData.publicUrl;

                }



                // GUARDAR OBJETO

                const { data, error } =
                    await supabaseClient
                        .from("items")
                        .insert({

                            type: type,

                            name: name,

                            description: description,

                            location: location,

                            date: date,

                            image_url: imageUrl,

                            status: "active"

                        })
                        .select();


                if (error) {

                    console.error(error);

                    throw new Error(
                        "No se pudo guardar el objeto."
                    );

                }



                // ÉXITO

                message.innerHTML = `

                    <div class="alert alert-success">

                        ✅ <strong>Objeto publicado correctamente.</strong>

                        <br>

                        La publicación ya está disponible
                        en Lost & Found.

                    </div>

                `;


                form.reset();



            } catch (error) {

                console.error(error);


                message.innerHTML = `

                    <div class="alert alert-danger">

                        ❌ ${error.message}

                    </div>

                `;


            } finally {

                submitButton.disabled = false;

                submitButton.textContent =
                    "Publicar objeto";

            }

        });

    </script>


</body>

</html>
